name: ATLAS API live post-auth diagnostic

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network-probe:
    if: github.head_ref == 'diagnostic/atlas-api-live-20261106'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe production and exact deployment (read-only)
        shell: bash
        run: |
          set -uo pipefail
          hosts=(
            "https://atlas-api-ivory.vercel.app"
            "https://atlas-3j92u0jnv-omio-studio.vercel.app"
          )
          paths=(
            "/health"
            "/v1/functions/0x9010d07c"
            "/v1/functions/search?q=getRoleMember"
          )
          for host in "${hosts[@]}"; do
            for path in "${paths[@]}"; do
              echo "::group::GET ${host}${path}"
              rm -f /tmp/atlas-response /tmp/atlas-headers
              curl --silent --show-error --max-time 12 \
                --output /tmp/atlas-response --dump-header /tmp/atlas-headers \
                --write-out 'HTTP=%{http_code} IP=%{remote_ip} dns=%{time_namelookup}s connect=%{time_connect}s first_byte=%{time_starttransfer}s total=%{time_total}s\\n' \
                "${host}${path}" || true
              echo "HEADERS:"
              if test -f /tmp/atlas-headers; then head -c 1700 /tmp/atlas-headers; fi
              echo ""
              echo "BODY:"
              if test -f /tmp/atlas-response; then head -c 1600 /tmp/atlas-response; fi
              echo ""
              echo "::endgroup::"
            done
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify canonical real Arkiv data on production
        run: node scripts/production-smoke.mjs https://atlas-api-ivory.vercel.app
