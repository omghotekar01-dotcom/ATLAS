name: ATLAS API network reachability diagnosis

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network-probe:
    if: github.head_ref == 'diagnostic/atlas-api-live-20261106'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Compare DNS and outbound HTTPS reachability (read only)
        shell: bash
        run: |
          set -uo pipefail
          echo "=== DNS ==="
          for host in example.com vercel.com atlas-api-ivory.vercel.app atlas-api-git-main-omio-studio.vercel.app; do
            echo "::group::DNS $host"
            getent ahostsv4 "$host" | head -n 3 || true
            echo "::endgroup::"
          done
          for url in \
            https://example.com \
            https://vercel.com \
            https://atlas-api-ivory.vercel.app/health \
            https://atlas-api-git-main-omio-studio.vercel.app/health; do
            echo "::group::GET $url"
            curl --silent --show-error --location --connect-timeout 5 --max-time 9 \
              --output /tmp/atlas-probe.txt \
              --write-out 'http=%{http_code} remote_ip=%{remote_ip} dns=%{time_namelookup}s connect=%{time_connect}s total=%{time_total}s\n' \
              "$url" || true
            if test -f /tmp/atlas-probe.txt; then
              head -c 250 /tmp/atlas-probe.txt || true
              rm -f /tmp/atlas-probe.txt
            fi
            echo ""
            echo "::endgroup::"
          done
