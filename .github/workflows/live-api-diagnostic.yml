name: ATLAS production TLS and HTTP connectivity

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tls-connectivity:
    if: github.head_ref == 'diagnostic/atlas-api-live-20261106'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Determine exactly where HTTPS stalls (read-only)
        shell: bash
        run: |
          set -uo pipefail
          for host in example.com vercel.com atlas-api-ivory.vercel.app atlas-3j92u0jnv-omio-studio.vercel.app; do
            echo "::group::TLS $host"
            timeout 7 openssl s_client -connect "$host:443" -servername "$host" -brief </dev/null 2>&1 | head -n 18 || true
            echo "::endgroup::"
            echo "::group::GET $host"
            curl --ipv4 --verbose --max-time 8 --connect-timeout 5 -o /tmp/atlas-body \
              -w 'RESULT http=%{http_code} remote_ip=%{remote_ip} tcp=%{time_connect}s TLS=%{time_appconnect}s TTFB=%{time_starttransfer}s total=%{time_total}s\\n' \
              "https://$host/health" 2>&1 | tail -n 38 || true
            echo "::endgroup::"
          done
