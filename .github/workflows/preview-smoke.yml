name: ATLAS production Arkiv smoke proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'diagnostic/atlas-vercel-preview-20261106'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Probe real production API (read-only)
        shell: bash
        run: |
          set -uo pipefail
          base="https://atlas-api-ivory.vercel.app"
          for route in '/health' '/v1/functions/0x9010d07c' '/v1/functions/search?q=getRoleMember' '/v1/functions/0x00000000'; do
            echo "::group::GET $base$route"
            rm -f /tmp/atlas-headers /tmp/atlas-body
            curl --silent --show-error --max-time 15 \
              --dump-header /tmp/atlas-headers --output /tmp/atlas-body \
              --write-out 'HTTP=%{http_code} TTFB=%{time_starttransfer}s TOTAL=%{time_total}s\\n' \
              "$base$route" || true
            test -f /tmp/atlas-headers && head -c 1300 /tmp/atlas-headers
            echo ""
            test -f /tmp/atlas-body && head -c 2800 /tmp/atlas-body
            echo ""
            echo "::endgroup::"
          done
      - name: Enforce canonical Arkiv data, provenance, and health
        run: node scripts/production-smoke.mjs https://atlas-api-ivory.vercel.app
