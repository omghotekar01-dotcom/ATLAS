name: Prepare ATLAS visual assets (one-time)
on:
  push:
    branches:
      - feat/atlas-brand-stage-20261107
permissions:
  contents: write

jobs:
  prepare:
    if: github.repository == 'omghotekar01-dotcom/ATLAS'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact staged changes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Download and verify owner-provided visuals, prepare attributed review commit
        env:
          REVIEW_BRANCH: feat/atlas-brand-assets-20261107
          ORBITAL_IMAGE: https://d2ol7oe51mr4n9.cloudfront.net/user_3J5uykCy852zvyGFuSsNlBvW4ji/8f598961-dbc4-4c1e-88c0-0526ac5ff9dc.png
          CONTEXT_IMAGE: https://d2ol7oe51mr4n9.cloudfront.net/user_3J5uykCy852zvyGFuSsNlBvW4ji/a36ec8ce-9bd1-4bee-bb72-e89b43569ff9.png
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$REVIEW_BRANCH" >/dev/null; then
            echo "$REVIEW_BRANCH already prepared" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          SOURCE_SHA="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          git switch --detach origin/main
          git switch -c "$REVIEW_BRANCH"
          git restore --source="$SOURCE_SHA" -- \
            apps/studio/src/routes/index.tsx \
            apps/studio/src/routes/landing.css \
            apps/studio/src/components/atlas/AppShell.tsx \
            apps/studio/index.html
          mkdir -p apps/studio/public/brand
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 90 \
            "$ORBITAL_IMAGE" -o apps/studio/public/brand/atlas-orbital-star.png
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 90 \
            "$CONTEXT_IMAGE" -o apps/studio/public/brand/atlas-ethereum-context.png
          echo '0ed772295314a9a065a9719bc4be6e71f98a0d62e25626e96039ce1441a5f051  apps/studio/public/brand/atlas-orbital-star.png' | sha256sum --check
          echo '426736ce423a111fa52e2e699705a70aefbee8e4e6e2f3f8ce5bd0e61f8ef111  apps/studio/public/brand/atlas-ethereum-context.png' | sha256sum --check
          git add -- apps/studio
          git diff --cached --check
          git config user.name 'Om Ghotekar'
          git config user.email 'omghotekar01@gmail.com'
          git commit -m 'feat(brand): use provided ATLAS logo and project cover art'
          test "$(git log -1 --format='%an <%ae>')" = 'Om Ghotekar <omghotekar01@gmail.com>'
          git push origin "HEAD:refs/heads/$REVIEW_BRANCH"
          echo "Assets and UI: $REVIEW_BRANCH" >> "$GITHUB_STEP_SUMMARY"
