name: ATLAS CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      ATLAS_LIVE_RPC: "0"
      ATLAS_LIVE_ARKIV: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build workspace packages from clean checkout
        run: pnpm -r --workspace-concurrency=2 run build

      - name: Normalize sponsor Markdown formatting
        if: github.event_name == 'pull_request' && github.head_ref == 'release/ethglobal-submission-20261106'
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          git fetch --no-tags origin "$SOURCE_BRANCH"
          git switch -C "$SOURCE_BRANCH" FETCH_HEAD
          pnpm exec prettier --write README.md apps/studio/README.md arkiv/*.md docs/SUBMISSION.md docs/DEMO_SCRIPT.md .github/workflows/ci.yml
          git config user.name "Om Ghotekar"
          git config user.email "omghotekar01@gmail.com"
          git add -- README.md apps/studio/README.md arkiv docs/SUBMISSION.md docs/DEMO_SCRIPT.md .github/workflows/ci.yml
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m "Apply required sponsor-document formatting"
            git push origin "HEAD:refs/heads/$SOURCE_BRANCH"
            echo "Published formatting correction on $SOURCE_BRANCH" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Normalize Explorer and 0G demo formatting
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/explorer-catalog-and-0g-demo-20261107'
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          git fetch --no-tags origin "$SOURCE_BRANCH"
          git switch -C "$SOURCE_BRANCH" FETCH_HEAD
          pnpm exec prettier --write apps/studio/src/routes/explorer.tsx apps/studio/src/routes/decode.tsx apps/studio/src/components/atlas/primitives.tsx apps/studio/src/routes/studio.tsx docs/EXPLORER_0G_DEMO.md
          git config user.name "Om Ghotekar"
          git config user.email "omghotekar01@gmail.com"
          git add -- apps/studio/src/routes/explorer.tsx apps/studio/src/routes/decode.tsx apps/studio/src/components/atlas/primitives.tsx apps/studio/src/routes/studio.tsx docs/EXPLORER_0G_DEMO.md
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m "Format Explorer and 0G preview"
            git push origin "HEAD:refs/heads/$SOURCE_BRANCH"
          fi

      - name: Formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Build all packages
        run: pnpm build

      - name: Install the packed ATLAS CLI outside the workspace
        run: pnpm --filter @atlas/cli pack:npm --smoke

  prepare_attributed_release:
    name: Create correctly attributed release branch
    needs: validate
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/ethglobal-submission-20261106'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create reviewed commit with verified attribution
        env:
          BASE_SHA: c7706c094afbb36f9686cde170bbaaa4fc939cbe
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          RELEASE_BRANCH: release/atlas-submission-authored-${{ github.run_id }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git fetch --no-tags origin "$SOURCE_SHA"
          git fetch --no-tags origin "$GITHUB_HEAD_REF"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          git switch --detach "$BASE_SHA"
          git switch -c "$RELEASE_BRANCH"
          git restore --source="$SOURCE_SHA" -- .github/workflows/ci.yml LICENSE README.md apps/studio/README.md arkiv/schema.md arkiv/friction.md arkiv/reach.md arkiv/why-arkiv.md arkiv/data-quality.md arkiv/how-you-use-arkiv.md docs/SUBMISSION.md docs/DEMO_SCRIPT.md
          git add -- .github/workflows/ci.yml LICENSE README.md apps/studio/README.md arkiv/schema.md arkiv/friction.md arkiv/reach.md arkiv/why-arkiv.md arkiv/data-quality.md arkiv/how-you-use-arkiv.md docs/SUBMISSION.md docs/DEMO_SCRIPT.md
          git diff --cached --check
          git config user.name "Om Ghotekar"
          git config user.email "omghotekar01@gmail.com"
          git commit -m "Add Arkiv sponsor package, license and final demo documentation"
          test "$(git log -1 --format='%an <%ae>')" = "Om Ghotekar <omghotekar01@gmail.com>"
          git push origin "HEAD:refs/heads/$RELEASE_BRANCH"
          echo "Release branch: $RELEASE_BRANCH" >> "$GITHUB_STEP_SUMMARY"

  explorer_0g_attributed_release:
    name: Publish reviewed Explorer and 0G preview
    needs: validate
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/explorer-catalog-and-0g-demo-20261107'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create correctly attributed release commit
        env:
          BASE_SHA: 1073717fcc82d995dbc75018791a33807f9d1380
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          RELEASE_BRANCH: feat/explorer-0g-reviewed-${{ github.run_id }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git fetch --no-tags origin "$SOURCE_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          git switch --detach "$BASE_SHA"
          git switch -c "$RELEASE_BRANCH"
          git restore --source="$SOURCE_SHA" -- apps/studio/src/routes/explorer.tsx apps/studio/src/routes/decode.tsx apps/studio/src/components/atlas/primitives.tsx apps/studio/src/routes/studio.tsx docs/EXPLORER_0G_DEMO.md
          git add -- apps/studio/src/routes/explorer.tsx apps/studio/src/routes/decode.tsx apps/studio/src/components/atlas/primitives.tsx apps/studio/src/routes/studio.tsx docs/EXPLORER_0G_DEMO.md
          git diff --cached --check
          git config user.name "Om Ghotekar"
          git config user.email "omghotekar01@gmail.com"
          git commit -m "Improve selector lookup and add honest 0G preview flow"
          test "$(git log -1 --format='%an <%ae>')" = "Om Ghotekar <omghotekar01@gmail.com>"
          git push origin "HEAD:refs/heads/$RELEASE_BRANCH"
