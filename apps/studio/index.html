<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/atlas-orbital-star.png" />
    <link rel="apple-touch-icon" href="/brand/atlas-orbital-star.png" />
    <meta name="theme-color" content="#101b16" />
    <script>
      try {
        const prefs = JSON.parse(localStorage.getItem("atlas.prefs.v1") || "{}");
        const dark =
          prefs.theme === "dark" ||
          (prefs.theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
        if (prefs.reduceMotion) document.documentElement.classList.add("reduce-motion");
      } catch {
        /* Fall back to the light theme without blocking page rendering. */
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Search, decode, and investigate EVM contract interactions with ATLAS."
    />
    <title>ATLAS Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
